<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>森林学校 Forest Friends · 学英语小游戏</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='26' y='34' width='12' height='22' rx='4' fill='%23855E3B'/%3E%3Cpath d='M10 38 Q32 4 54 38 Z' fill='%236BCB77'/%3E%3Ccircle cx='22' cy='30' r='7' fill='%23FFC94D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn" crossorigin>
<link href="https://miaoda.feishu.cn/fonts/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#AEE3FF; --sky2:#E7F8FF; --grass:#8FD655; --grass2:#6FC543;
  --ink:#2E3A46; --red:#F2665E; --yellow:#FFC94D; --yellow-d:#E8A33D;
  --blue:#4C9AEA; --blue-d:#3A7EC9; --green:#6BCB77; --green-d:#4FAE5C;
  --orange:#FF8C42; --cream:#FFF9EC; --cream-d:#EFDFB8; --muted:#93A3AD;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);min-height:100vh;overflow-x:hidden;
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 55%,var(--grass) 55%,var(--grass2) 100%);
  background-attachment:fixed;
}
.cloud{position:fixed;background:#fff;opacity:.85;border-radius:999px;pointer-events:none;z-index:0}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud.c1{width:120px;height:36px;top:5%;left:5%}
.cloud.c1::before{width:52px;height:52px;top:-22px;left:18px}
.cloud.c1::after{width:38px;height:38px;top:-14px;right:14px}
.cloud.c2{width:90px;height:28px;top:12%;right:9%;opacity:.6}
.cloud.c2::before{width:40px;height:40px;top:-16px;left:12px}
.cloud.c2::after{width:30px;height:30px;top:-10px;right:10px}
.tree{position:fixed;bottom:0;pointer-events:none;z-index:0}
.tree .trunk{position:absolute;bottom:0;background:#8A5A33;border-radius:6px}
.tree .crown{position:absolute;background:var(--green);border-radius:50%}
.tree .crown::before,.tree .crown::after{content:"";position:absolute;background:var(--green);border-radius:50%}
.tree.t1{left:0;width:90px;height:150px}
.tree.t1 .trunk{left:38px;width:16px;height:80px}
.tree.t1 .crown{left:4px;top:6px;width:82px;height:82px}
.tree.t1 .crown::before{left:-20px;top:22px;width:60px;height:60px}
.tree.t1 .crown::after{right:-22px;top:20px;width:56px;height:56px}
.tree.t2{right:0;width:70px;height:120px}
.tree.t2 .trunk{left:30px;width:12px;height:64px}
.tree.t2 .crown{left:2px;top:4px;width:66px;height:66px}
.tree.t2 .crown::before{left:-16px;top:18px;width:48px;height:48px}
.tree.t2 .crown::after{right:-16px;top:16px;width:44px;height:44px}

#app{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:12px 14px 30px}
.view{display:flex;flex-direction:column;min-height:calc(100vh - 42px)}
.view[hidden]{display:none}
.fade-in{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== 顶栏 ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 10px;width:min(680px,94%);margin:0 auto}
.back-btn{font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--cream-d);border-radius:999px;padding:8px 16px;min-height:44px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.back-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.progress{font-weight:700;color:var(--ink);background:rgba(255,255,255,.8);border-radius:999px;padding:7px 14px;font-size:14px}

/* ===== 通用按钮 ===== */
.big-btn{font-family:inherit;font-weight:700;font-size:22px;color:#fff;cursor:pointer;background:var(--green);border:4px solid var(--green-d);border-radius:999px;padding:14px 46px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.ghost-btn{font-family:inherit;font-weight:700;font-size:16px;color:var(--ink);cursor:pointer;background:rgba(255,255,255,.9);border:3px solid var(--cream-d);border-radius:999px;padding:10px 28px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.ghost-btn:active{transform:translateY(2px)}
.mute-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--cream-d);background:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.08);position:fixed;top:12px;right:12px;z-index:50}
.mute-btn svg{width:22px;height:22px}
.mute-btn.off{background:#E8ECEF}
.mute-btn.off svg .wave{opacity:0}

/* ===== 主页 ===== */
.home-body{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:20px}
.logo{font-family:"Fredoka","Noto Sans SC",sans-serif;font-weight:700;font-size:46px;line-height:1.1;color:var(--ink);background:#fff;padding:8px 26px;border-radius:26px;border:4px solid var(--yellow);box-shadow:0 6px 0 rgba(0,0,0,.08);transform:rotate(-1.5deg)}
.logo-en{font-family:"Fredoka",sans-serif;font-weight:600;font-size:19px;letter-spacing:3px;color:#fff;margin-top:10px;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.home-sub{margin-top:12px;font-size:16px;color:var(--ink);background:rgba(255,255,255,.85);padding:8px 18px;border-radius:999px;font-weight:500}
.pick-title{margin-top:22px;font-weight:700;font-size:17px;color:var(--ink);background:rgba(255,255,255,.8);padding:6px 16px;border-radius:999px}
.hero-cards{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.hero-card{width:130px;background:#fff;border:4px solid var(--cream-d);border-radius:24px;padding:14px 10px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 rgba(0,0,0,.08);transition:transform .15s, box-shadow .15s;font-family:inherit;color:var(--ink)}
.hero-card img{width:92px;height:92px;object-fit:cover;border-radius:50%;background:#fff;border:3px solid var(--cream-d)}
.hero-card span{font-weight:700;font-size:17px}
.hero-card.sel{border-color:var(--orange);box-shadow:0 5px 0 rgba(0,0,0,.08),0 0 0 5px rgba(255,140,66,.25)}
.hero-card:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.name-row{margin-top:18px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.9);padding:8px 16px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.06)}
.name-row label{font-weight:700;font-size:15px}
.name-row input{font-family:"Fredoka","Noto Sans SC",sans-serif;font-size:17px;font-weight:600;width:110px;text-align:center;border:2px solid var(--cream-d);border-radius:999px;padding:6px 10px;outline:none;background:#fff;color:var(--ink)}
.name-row input:focus{border-color:var(--blue)}
.mode-pick{display:flex;gap:10px;margin-top:16px}
.mode-btn{font-family:inherit;font-weight:700;font-size:16px;color:var(--ink);background:#fff;border:3px solid var(--cream-d);border-radius:999px;padding:8px 24px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.08);transition:transform .15s}
.mode-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.mode-btn.sel{background:var(--yellow);border-color:var(--orange);box-shadow:0 3px 0 rgba(0,0,0,.14)}
.hero-card{position:relative;width:130px;background:#fff;border:4px solid var(--cream-d);border-radius:24px;padding:14px 10px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 rgba(0,0,0,.08);transition:transform .15s, box-shadow .15s;font-family:inherit;color:var(--ink)}
.hero-card .tag{position:absolute;top:-10px;right:-10px;background:var(--orange);color:#fff;font-size:14px;font-weight:700;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.hero-card.p1{border-color:var(--blue);box-shadow:0 5px 0 rgba(0,0,0,.08),0 0 0 5px rgba(62,168,255,.22)}
.hero-card.p2{border-color:var(--orange);box-shadow:0 5px 0 rgba(0,0,0,.08),0 0 0 5px rgba(255,140,66,.25)}
.hero-card.taken{opacity:.5;cursor:not-allowed}
.start-area{margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.badges{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.badge{width:64px;height:64px;border-radius:18px;background:#fff;border:3px solid var(--cream-d);display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-weight:700;font-size:16px;color:#c3ccd4;transition:all .3s;overflow:hidden}
.badge.done{background:var(--yellow);border-color:var(--yellow-d);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.1);animation:pop .45s ease}
.badge.done img{width:100%;height:100%;object-fit:cover}
.badges-hint{margin-top:10px;font-size:14px;color:var(--ink);background:rgba(255,255,255,.75);padding:6px 14px;border-radius:999px}

/* ===== 对话区 ===== */
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:6px;width:min(680px,94%);margin:0 auto}
.turn-row{display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.94);border-radius:999px;padding:6px 16px;box-shadow:0 3px 0 rgba(0,0,0,.07);width:100%;flex-wrap:wrap}
.pchip{display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:999px;border:3px solid transparent}
.pchip img{width:40px;height:40px;object-fit:cover;border-radius:50%;border:2px solid var(--cream-d)}
.pchip .pname{font-weight:700;font-size:15px;color:var(--ink)}
.pchip .pstars{font-size:14px;color:var(--orange);letter-spacing:1px}
.pchip.now{background:#FFF7E8;border-color:var(--orange)}
.turn-msg{font-weight:700;font-size:15px;color:var(--ink)}
.friend-show{display:flex;flex-direction:column;align-items:center;gap:8px}
.friend-avatar{width:150px;height:150px;border-radius:50%;background:#fff;border:5px solid var(--yellow);box-shadow:0 6px 0 rgba(0,0,0,.1);overflow:hidden;display:grid;place-items:center}
.friend-avatar img{width:100%;height:100%;object-fit:cover}
.friend-avatar.bounce{animation:bounce .6s ease}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
.friend-name{font-family:"Fredoka",sans-serif;font-weight:700;font-size:20px;color:#fff;background:var(--blue);border:3px solid var(--blue-d);border-radius:999px;padding:4px 18px;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.bubble{background:#fff;border:4px solid var(--cream-d);border-radius:26px;padding:16px 22px;font-family:"Fredoka","Noto Sans SC",sans-serif;font-weight:600;font-size:23px;line-height:1.5;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.08);max-width:560px;position:relative;min-height:70px;display:grid;place-items:center}
.bubble::before{content:"";position:absolute;top:-14px;left:50%;transform:translateX(-50%);border:9px solid transparent;border-bottom-color:var(--cream-d)}
.speak-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.speak-btn{font-family:inherit;font-weight:700;font-size:15px;color:#fff;cursor:pointer;background:var(--orange);border:3px solid #E57A2E;border-radius:999px;padding:9px 20px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.speak-btn:active{transform:translateY(2px)}
.speak-btn svg{width:18px;height:18px}
.speak-btn.playing{background:var(--green);border-color:var(--green-d)}
.options{display:flex;flex-direction:column;gap:12px;width:100%;max-width:560px;margin-top:4px}
.option-btn{font-family:"Fredoka","Noto Sans SC",sans-serif;font-weight:600;font-size:20px;color:var(--ink);background:#fff;border:4px solid var(--cream-d);border-radius:999px;padding:13px 20px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.08);transition:transform .15s, box-shadow .15s, border-color .2s;text-align:center}
.option-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.option-btn.hit{border-color:var(--green);background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);animation:pop .4s ease}
.option-btn.miss{border-color:var(--red);background:var(--red);color:#fff;animation:shake .4s}
.option-btn.lock{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.35);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.wall{display:flex;gap:10px;margin:20px auto 0;width:min(680px,94%);flex-wrap:wrap;justify-content:center;background:rgba(255,255,255,.55);border-radius:24px;padding:10px;min-height:70px}
.wall-title{width:100%;text-align:center;font-size:14px;font-weight:700;color:var(--ink)}
.wall .wall-slot{width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.7);border:2px dashed var(--cream-d);display:grid;place-items:center}
.wall .wall-slot img{width:100%;height:100%;object-fit:cover;border-radius:14px;animation:pop .45s ease}

/* ===== 字母怪兽区 ===== */
.monster-stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:10px;width:min(680px,94%);margin:0 auto}
.tip{font-size:16px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.85);padding:8px 20px;border-radius:999px;text-align:center}
.food-card{display:flex;align-items:center;gap:12px;background:#fff;border:4px solid var(--yellow);border-radius:26px;padding:12px 24px;box-shadow:0 5px 0 rgba(0,0,0,.08)}
.food-word{font-family:"Fredoka",sans-serif;font-weight:700;font-size:44px;color:var(--ink);letter-spacing:2px;min-width:110px;text-align:center}
.mini-speak{width:46px;height:46px;border-radius:50%;border:3px solid var(--orange);background:var(--orange);cursor:pointer;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.mini-speak svg{width:22px;height:22px}
.mini-speak:active{transform:translateY(2px)}
.monsters{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.monster-card{width:132px;background:#fff;border:4px solid var(--cream-d);border-radius:22px;padding:12px 8px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 rgba(0,0,0,.08);transition:transform .15s, box-shadow .15s}
.monster-card img{width:96px;height:96px;object-fit:contain}
.monster-card .m-letter{font-family:"Fredoka",sans-serif;font-weight:700;font-size:26px;color:var(--blue)}
.monster-card:active{transform:translateY(3px)}
.monster-card.hit{border-color:var(--green);box-shadow:0 5px 0 rgba(0,0,0,.08),0 0 0 6px rgba(107,203,119,.3)}
.monster-card.hit img{animation:bounce .5s ease}
.monster-card.miss{border-color:var(--red);animation:shake .4s}
.monster-card.lock{cursor:default}

/* ===== 派对页 ===== */
.party-body{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:16px}
.party-title{font-family:"Fredoka","Noto Sans SC",sans-serif;font-weight:700;font-size:42px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.party-sub{font-size:17px;color:var(--ink);background:rgba(255,255,255,.88);padding:8px 20px;border-radius:999px;font-weight:500}
.party-wall{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;background:rgba(255,255,255,.6);border-radius:26px;padding:16px;max-width:640px}
.party-wall .p-item{width:86px;display:flex;flex-direction:column;align-items:center;gap:4px}
.party-wall img{width:76px;height:76px;object-fit:cover;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.12);animation:pop .5s ease both}
.party-wall .p-name{font-family:"Fredoka",sans-serif;font-weight:600;font-size:13px;color:var(--ink)}
.party-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* ===== 星星特效 ===== */
.star-fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.star{position:absolute;background:var(--yellow);width:16px;height:16px;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:starFly 1s ease-out forwards}
.star.s2{background:var(--orange)}
.star.s3{background:var(--blue)}
@keyframes starFly{0%{transform:translateY(0) scale(.4);opacity:1}100%{transform:translateY(-120px) scale(1.1);opacity:0}}
.star-big{position:fixed;left:50%;top:38%;width:26px;height:26px;background:var(--yellow);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);pointer-events:none;z-index:60;animation:bigStar .9s ease-out forwards}
.star-big.s2{background:var(--orange)}
@keyframes bigStar{0%{transform:translate(-50%,0) scale(.3);opacity:0}40%{transform:translate(-50%,-60px) scale(1.4);opacity:1}100%{transform:translate(-50%,-160px) scale(.8);opacity:0}}

/* ===== 响应式 ===== */
@media (max-width:600px){
  .logo{font-size:33px;padding:6px 18px}
  .hero-card{width:100px}
  .hero-card img{width:72px;height:72px}
  .friend-avatar{width:120px;height:120px}
  .bubble{font-size:19px;padding:13px 16px}
  .option-btn{font-size:17px;padding:11px 14px}
  .monster-card{width:106px}
  .monster-card img{width:78px;height:78px}
  .food-word{font-size:36px;min-width:90px}
  .party-title{font-size:32px}
  .badge{width:52px;height:52px;font-size:14px;border-radius:14px}
  .wall .wall-slot{width:48px;height:48px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="tree t1"></div>
<div class="tree t2"></div>

<div id="app">

  <!-- ===== 视图：主页 ===== -->
  <section class="view fade-in" id="view-home">
    <div class="home-body">
      <h1 class="logo">森林学校</h1>
      <div class="logo-en">FOREST FRIENDS</div>
      <p class="home-sub">交新朋友，学说英语</p>
      <div class="mode-pick">
        <button class="mode-btn sel" data-mode="single">单人玩</button>
        <button class="mode-btn" data-mode="duo">双人对战</button>
      </div>
      <p class="pick-title" id="pickTitle">选一个可爱的自己</p>
      <div class="hero-cards">
        <button class="hero-card" data-hero="bunny"><img src="assets/hero-bunny.png" alt="小兔"><span>小兔</span></button>
        <button class="hero-card" data-hero="bear"><img src="assets/hero-bear.png" alt="小熊"><span>小熊</span></button>
        <button class="hero-card" data-hero="cat"><img src="assets/hero-cat.png" alt="小猫"><span>小猫</span></button>
      </div>
      <div class="name-row">
        <label for="nameInput">我的英文名</label>
        <input id="nameInput" maxlength="10" value="Ben" autocomplete="off">
      </div>
      <div class="name-row" id="nameRow2" hidden>
        <label for="nameInput2">2P 英文名</label>
        <input id="nameInput2" maxlength="10" value="Amy" autocomplete="off">
      </div>
      <div class="start-area">
        <button class="big-btn" id="startBtn">开始交朋友</button>
        <div class="badges" id="homeBadges"></div>
        <p class="badges-hint">交满 6 个朋友，再喂饱 4 只字母小动物，就能开森林派对</p>
      </div>
    </div>
  </section>

  <!-- ===== 视图：对话闯关 ===== -->
  <section class="view fade-in" id="view-dialog" hidden>
    <header class="topbar">
      <button class="back-btn" id="dialogBack">返回</button>
      <div class="progress" id="dialogProgress">朋友 1 / 6</div>
    </header>
    <div class="stage">
      <div class="turn-row" id="dialogTurn" hidden></div>
      <div class="friend-show">
        <div class="friend-avatar" id="friendAvatar"></div>
        <div class="friend-name" id="friendName"></div>
      </div>
      <div class="bubble" id="bubble"></div>
      <div class="speak-row">
        <button class="speak-btn" id="dialogSpeak">

<script>
'use strict';
/* ===== 数据 ===== */
const FRIENDS = [
  { key:'duck', name:'Duck', zh:'小鸭子', q:"Hello! What's your name?", zhq:'你好！你叫什么名字？', options:[
    {t:'My name is {name}.', ok:true},{t:'Good night!', ok:false},{t:"I'm fine.", ok:false}]},
  { key:'squirrel', name:'Squirrel', zh:'小松鼠', q:'Nice to meet you!', zhq:'很高兴认识你！', options:[
    {t:'Nice to meet you, too.', ok:true},{t:'Thank you.', ok:false},{t:'Good morning.', ok:false}]},
  { key:'hedgehog', name:'Hedgehog', zh:'小刺猬', q:'Good morning!', zhq:'早上好！', options:[
    {t:'Good morning!', ok:true},{t:'Good night!', ok:false},{t:'Goodbye!', ok:false}]},
  { key:'deer', name:'Deer', zh:'小鹿', q:'How are you?', zhq:'你好吗？', options:[
    {t:"I'm fine, thank you.", ok:true},{t:'My name is {name}.', ok:false},{t:'Good afternoon.', ok:false}]},
  { key:'owl', name:'Owl', zh:'小猫头鹰', q:'Good afternoon!', zhq:'下午好！', options:[
    {t:'Good afternoon!', ok:true},{t:'Good morning!', ok:false},{t:'Good night!', ok:false}]},
  { key:'fox', name:'Fox', zh:'小狐狸', q:"Hi! I'm Foxy. What's your name?", zhq:'嗨！我是小狐狸，你叫什么名字？', options:[
    {t:'Hi, Foxy! My name is {name}.', ok:true},{t:"I'm fine.", ok:false},{t:'Nice to meet you, too.', ok:false}]}
];
const MONSTERS = [
  { letter:'A', img:'monster-a', word:'ant', zh:'蚂蚁' },
  { letter:'B', img:'monster-b', word:'bee', zh:'蜜蜂' },
  { letter:'C', img:'monster-c', word:'cow', zh:'奶牛' },
  { letter:'D', img:'monster-d', word:'dog', zh:'小狗' }
];
const HEROES = { bunny:'hero-bunny', bear:'hero-bear', cat:'hero-cat' };

/* ===== 工具 ===== */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function imgByKey(key){ return document.getElementById('img-'+key).cloneNode(true); }

/* ===== 语音（内置音频，不依赖设备语音包） ===== */
let soundOn = true;
const VOICE = {
  "Hello! What's your name?": 'hello-name',
  'Nice to meet you!': 'nice',
  'Good morning!': 'morning',
  'How are you?': 'howareyou',
  'Good afternoon!': 'afternoon',
  "Hi! I'm Foxy. What's your name?": 'foxy',
  'Great!': 'great',
  'Try again!': 'tryagain',
  ant: 'ant', bee: 'bee', cow: 'cow', dog: 'dog'
};
let voiceEl = null;
function speak(text, rate){
  if(!soundOn) return;
  stopSpeak();
  const key = VOICE[text];
  if(key){
    voiceEl = document.getElementById('voice-' + key);
    if(voiceEl){
      voiceEl.currentTime = 0;
      const pr = voiceEl.play();
      if(pr && pr.catch) pr.catch(()=>{});
    }
  }else if('speechSynthesis' in window){
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = rate || 0.8;
    u.pitch = 1.15;
    speechSynthesis.speak(u);
  }
}
function stopSpeak(){
  if(voiceEl){ try{ voiceEl.pause(); }catch(e){} }
  if('speechSynthesis' in window) speechSynthesis.cancel();
}

/* ===== 音效 ===== */
let actx = null;
function ensureAudio(){
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    actx = new AC();
  }
  if(actx.state === 'suspended') actx.resume();
  return actx;
}
function beep(freq, dur, type, vol, delay){
  if(!soundOn) return;
  const ctx = ensureAudio();
  if(!ctx) return;
  const t0 = ctx.currentTime + (delay||0);
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type||'sine';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol||0.18, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(g).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0+dur+0.05);
}
function sfxCorrect(){ beep(523,0.12,'sine',0.2); beep(659,0.12,'sine',0.2,0.11); beep(784,0.22,'sine',0.22,0.22); }
function sfxWrong(){ beep(196,0.22,'sawtooth',0.12); beep(147,0.3,'sawtooth',0.12,0.16); }
function sfxWin(){ [523,659,784,1047].forEach((f,i)=>beep(f,0.16,'triangle',0.22,i*0.13)); }

/* ===== 星星特效 ===== */
function burstStars(originEl){
  const fx = document.createElement('div');
  fx.className = 'star-fx';
  document.body.appendChild(fx);
  const r = originEl.getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top + r.height/2;
  for(let i=0;i<12;i++){
    const s = document.createElement('span');
    s.className = 'star' + (i%3===0?' s2':(i%3===1?' s3':''));
    s.style.left = (cx + (Math.random()*120-60)) + 'px';
    s.style.top = (cy + (Math.random()*30-10)) + 'px';
    s.style.animationDelay = (Math.random()*0.25) + 's';
    fx.appendChild(s);
  }
  setTimeout(()=>fx.remove(), 1600);
}

/* ===== 状态 ===== */
let hero = 'bunny';
let myName = 'Ben';
let friendIdx = 0;
let monsterRound = 0;
let monsterQueue = [];
let locked = false;
const doneFriends = [];
const doneMonsters = [];
/* 双人模式 */
let mode = 'single';
let p1Hero = null, p2Hero = null;
let p1Name = 'Ben', p2Name = 'Amy';
let scores = [0, 0];
let current = 0;
let turnCount = 0;

/* ===== 视图切换 ===== */
const VIEWS = { home:'view-home', dialog:'view-dialog', monster:'view-monster', party:'view-party' };
let currentView = 'home';
function showView(name){
  stopSpeak();
  Object.keys(VIEWS).forEach(k=>{ document.getElementById(VIEWS[k]).hidden = (k!==name); });
  currentView = name;
  if(name==='home') renderHomeBadges();
}

/* ===== 主页 ===== */
function tagEl(t){
  const s = document.createElement('span');
  s.className = 'tag';
  s.textContent = t;
  return s;
}
function resetHeroPicks(){
  p1Hero = null; p2Hero = null;
  heroCards.forEach(c=>{
    c.classList.remove('sel','p1','p2','taken');
    const tag = c.querySelector('.tag');
    if(tag) tag.remove();
  });
  const t = document.getElementById('pickTitle');
  if(mode==='duo'){
    t.textContent = '1P 先选一个可爱的自己';
  }else{
    t.textContent = '选一个可爱的自己';
    heroCards[0].classList.add('sel');
  }
}
const modeBtns = document.querySelectorAll('.mode-btn');
modeBtns.forEach(b=>{
  b.addEventListener('click', ()=>{
    if(b.classList.contains('sel')) return;
    mode = b.dataset.mode;
    modeBtns.forEach(x=>x.classList.toggle('sel', x===b));
    document.getElementById('nameRow2').hidden = (mode!=='duo');
    document.getElementById('startBtn').textContent = (mode==='duo') ? '开始对战' : '开始交朋友';
    resetHeroPicks();
  });
});
const heroCards = document.querySelectorAll('.hero-card');
heroCards.forEach(card=>{
  card.addEventListener('click', ()=>{
    const h = card.dataset.hero;
    if(mode==='duo'){
      if(!p1Hero){
        p1Hero = h;
        card.classList.add('p1');
        card.appendChild(tagEl('1P'));
        heroCards.forEach(c=>{ if(c.dataset.hero!==h) c.classList.add('taken'); });
        document.getElementById('pickTitle').textContent = '2P 再选一个，别和 1P 一样哦';
      }else if(!p2Hero && h!==p1Hero){
        p2Hero = h;
        card.classList.add('p2');
        card.appendChild(tagEl('2P'));
        heroCards.forEach(c=>{ if(c.dataset.hero===h) c.classList.add('taken'); });
        document.getElementById('pickTitle').textContent = '两个都选好啦，开始对战！';
      }
    }else{
      hero = h;
      heroCards.forEach(c=>c.classList.toggle('sel', c===card));
    }
  });
});
heroCards[0].classList.add('sel');
document.getElementById('nameInput').addEventListener('input', e=>{
  myName = e.target.value.trim() || 'Ben';
});

function renderHomeBadges(){
  const el = document.getElementById('homeBadges');
  el.innerHTML = '';
  FRIENDS.forEach(f=>{
    const d = document.createElement('div');
    const done = doneFriends.includes(f.key);
    d.className = 'badge' + (done ? ' done' : '');
    if(done) d.appendChild(imgByKey(f.key));
    else d.textContent = '?';
    el.appendChild(d);
  });
  MONSTERS.forEach(m=>{
    const d = document.createElement('div');
    const done = doneMonsters.includes(m.letter);
    d.className = 'badge' + (done ? ' done' : '');
    d.textContent = done ? m.letter : '?';
    el.appendChild(d);
  });
}

/* ===== 双人计分条 ===== */
function updateTurnUI(){
  const show = (mode==='duo');
  ['dialogTurn','monsterTurn'].forEach(id=>{
    const el = document.getElementById(id);
    el.hidden = !show;
    if(!show) return;
    el.innerHTML = '';
    [0,1].forEach(p=>{
      const chip = document.createElement('div');
      chip.className = 'pchip' + (p===current ? ' now' : '');
      chip.appendChild(imgByKey(HEROES[p===0?p1Hero:p2Hero]));
      const nm = document.createElement('span');
      nm.className = 'pname';
      nm.textContent = p===0 ? p1Name : p2Name;
      chip.appendChild(nm);
      const st = document.createElement('span');
      st.className = 'pstars';
      st.textContent = '★'.repeat(scores[p]);
      chip.appendChild(st);
      el.appendChild(chip);
    });
    const msg = document.createElement('span');
    msg.className = 'turn-msg';
    msg.textContent = '轮到 ' + (current===0?p1Name:p2Name) + '！';
    el.appendChild(msg);
  });
}

/* ===== 对话闯关 ===== */
function showFriend(){
  if(mode==='duo'){ current = turnCount % 2; turnCount++; updateTurnUI(); }
  const f = FRIENDS[friendIdx];
  locked = false;
  const av = document.getElementById('friendAvatar');
  av.innerHTML = '';
  av.appendChild(imgByKey(f.key));
  document.getElementById('friendName').textContent = f.name;
  const b = document.getElementById('bubble');
  b.textContent = f.q;
  document.getElementById('dialogProgress').textContent = '朋友 ' + (friendIdx+1) + ' / ' + FRIENDS.length;
  const box = document.getElementById('dialogOptions');
  box.innerHTML = '';
  shuffle(f.options).forEach(o=>{
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = o.t.replace('{name}', myName);
    btn.addEventListener('click', ()=>onFriendPick(btn, o));
    box.appendChild(btn);
  });
  renderWall();
  speak(f.q, 0.85);
}
function onFriendPick(btn, o){
  if(locked) return;
  locked = true;
  if(o.ok){
    btn.classList.add('hit');
    sfxCorrect();
    burstStars(btn);
    const av = document.getElementById('friendAvatar');
    av.classList.add('bounce');
    const f = FRIENDS[friendIdx];
    speak('Great!');
    if(mode==='duo'){ scores[current]++; updateTurnUI(); }
    if(!doneFriends.includes(f.key)) doneFriends.push(f.key);
    renderWall();
    setTimeout(()=>{
      av.classList.remove('bounce');
      friendIdx++;
      if(friendIdx < FRIENDS.length) showFriend();
      else startMonsters();
    }, 950);
  }else{
    btn.classList.add('miss');
    sfxWrong();
    const f = FRIENDS[friendIdx];
    speak('Try again!');
    if(mode==='duo'){
      setTimeout(()=>{
        btn.classList.remove('miss');
        friendIdx++;
        if(friendIdx < FRIENDS.length) showFriend();
        else startMonsters();
      }, 900);
    }else{
      document.querySelectorAll('#dialogOptions .option-btn').forEach(b=>b.classList.add('lock'));
      setTimeout(()=>{
        btn.classList.remove('miss');
        document.querySelectorAll('#dialogOptions .option-btn').forEach(b=>b.classList.remove('lock'));
        locked = false;
        speak(f.q, 0.85);
      }, 950);
    }
  }
}
function renderWall(){
  const box = document.getElementById('wallSlots');
  box.innerHTML = '';
  for(let i=0;i<FRIENDS.length;i++){
    const slot = document.createElement('div');
    slot.className = 'wall-slot';
    if(doneFriends.includes(FRIENDS[i].key)) slot.appendChild(imgByKey(FRIENDS[i].key));
    box.appendChild(slot);
  }
}

/* ===== 字母怪兽 ===== */
function startMonsters(){
  monsterRound = 0;
  monsterQueue = shuffle(MONSTERS.slice());
  showView('monster');
  showMonsterRound();
}
function showMonsterRound(){
  if(mode==='duo'){ current = turnCount % 2; turnCount++; updateTurnUI(); }
  const m = monsterQueue[monsterRound];
  locked = false;
  document.getElementById('foodWord').textContent = m.word;
  document.getElementById('monsterProgress').textContent = '字母 ' + (monsterRound+1) + ' / ' + MONSTERS.length;
  const box = document.getElementById('monsters');
  box.innerHTML = '';
  MONSTERS.forEach(mm=>{
    const card = document.createElement('button');
    card.className = 'monster-card';
    card.appendChild(imgByKey(mm.img));
    const l = document.createElement('span');
    l.className = 'm-letter';
    l.textContent = mm.letter;
    card.appendChild(l);
    card.addEventListener('click', ()=>onMonsterPick(card, mm));
    box.appendChild(card);
  });
  speak(m.word, 0.8);
}
function onMonsterPick(card, mm){
  if(locked) return;
  const m = monsterQueue[monsterRound];
  locked = true;
  if(mm.letter === m.letter){
    card.classList.add('hit');
    sfxCorrect();
    burstStars(card);
    speak(m.word, 0.8);
    if(mode==='duo'){ scores[current]++; updateTurnUI(); }
    if(!doneMonsters.includes(m.letter)) doneMonsters.push(m.letter);
    setTimeout(()=>{
      monsterRound++;
      if(monsterRound < monsterQueue.length) showMonsterRound();
      else showParty();
    }, 1050);
  }else{
    card.classList.add('miss');
    sfxWrong();
    speak('Try again!');
    if(mode==='duo'){
      setTimeout(()=>{
        card.classList.remove('miss');
        monsterRound++;
        if(monsterRound < monsterQueue.length) showMonsterRound();
        else showParty();
      }, 900);
    }else{
      setTimeout(()=>{
        card.classList.remove('miss');
        locked = false;
      }, 850);
    }
  }
}

/* ===== 森林派对 ===== */
function showParty(){
  showView('party');
  sfxWin();
  const sub = document.getElementById('partySub');
  const wall = document.getElementById('partyWall');
  wall.innerHTML = '';
  const items = [];
  if(mode==='duo'){
    let msg = p1Name + ' ' + scores[0] + ' 星 · ' + p2Name + ' ' + scores[1] + ' 星';
    if(scores[0]===scores[1]) msg += '，平局！都好棒！';
    else msg += '，' + (scores[0]>scores[1]?p1Name:p2Name) + ' 赢啦！';
    sub.textContent = msg;
    items.push(HEROES[p1Hero], HEROES[p2Hero]);
  }else{
    sub.textContent = 'You did it! 所有朋友和字母怪兽都来了';
    items.push(HEROES[hero]);
  }
  FRIENDS.forEach(f=>{ if(doneFriends.includes(f.key)) items.push(f.key); });
  MONSTERS.forEach(m=>{ if(doneMonsters.includes(m.letter)) items.push(m.img); });
  items.forEach(key=>{
    const it = document.createElement('div');
    it.className = 'p-item';
    it.appendChild(imgByKey(key));
    wall.appendChild(it);
  });
  for(let i=0;i<6;i++){
    const s = document.createElement('span');
    s.className = 'star-big' + (i%2?' s2':'');
    s.style.animationDelay = (i*0.15) + 's';
    s.style.left = (20 + i*13) + '%';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 2500);
  }
}

/* ===== 初始化 ===== */
function startGame(){
  if(mode==='duo'){
    if(!p1Hero || !p2Hero){
      document.getElementById('pickTitle').textContent = '1P 和 2P 都要选好才能开始哦';
      return;
    }
    p1Name = document.getElementById('nameInput').value.trim() || 'Ben';
    p2Name = document.getElementById('nameInput2').value.trim() || 'Amy';
    scores = [0, 0];
    current = 0;
    turnCount = 0;
  }else{
    myName = document.getElementById('nameInput').value.trim() || 'Ben';
  }
  friendIdx = 0;
  doneFriends.length = 0;
  doneMonsters.length = 0;
  showView('dialog');
  updateTurnUI();
  showFriend();
}
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('nameInput').addEventListener('keydown', e=>{ if(e.key==='Enter') startGame(); });
document.getElementById('dialogBack').addEventListener('click', ()=>showView('home'));
document.getElementById('monsterBack').addEventListener('click', ()=>showView('home'));
document.getElementById('homeBtn').addEventListener('click', ()=>showView('home'));
document.getElementById('replayBtn').addEventListener('click', startGame);
document.getElementById('dialogSpeak').addEventListener('click', ()=>{
  speak(FRIENDS[friendIdx].q, 0.85);
});
document.getElementById('foodSpeak').addEventListener('click', ()=>{
  if(monsterQueue.length) speak(monsterQueue[monsterRound].word, 0.8);
});
const muteBtn = document.getElementById('muteBtn');

  soundOn = !soundOn;
